name: Auto Update Wages

on:
  schedule:
    # 매주 일요일 09:00 KST (00:00 UTC)에 자동으로 실행되도록 설정
    - cron: '0 0 * * 0'
  workflow_dispatch: # GitHub Actions 탭에서 수동으로도 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-wages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Wage Update Scraper
        run: python -X utf8 update_wages.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wage_data.js
          if git diff-index --quiet HEAD; then
            echo "No changes detected in wage data."
          else
            git commit -m "auto: update wage data to latest standards"
            git push origin HEAD:${{ github.ref_name }}
          fi
